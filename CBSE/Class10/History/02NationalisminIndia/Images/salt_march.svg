<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #6a1b9a; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #8e24aa; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #4a148c; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow10" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">THE SALT MARCH &amp; CIVIL DISOBEDIENCE MOVEMENT (1930)</text>
    <text x="400" y="52" class="subtitle">Salt as a Powerful Symbol to Unite the Entire Nation</text>

    <!-- 3 Grid Column Cards -->
    <!-- Card 1: Salt as Symbol & Ultimatum -->
    <g transform="translate(40, 70)" filter="url(#shadow10)">
        <rect width="220" height="355" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#7b1fa2"/>
        <text x="87.5" y="31" class="badge">1. SALT AS SYMBOL</text>
        <rect x="15" y="48" width="190" height="2" fill="#e1bee7"/>

        <text x="15" y="72" class="card-title">Essential Commodity</text>

        <text x="15" y="96" class="card-text">• Salt was consumed by rich &amp; poor</text>
        <text x="23" y="112" class="card-text">alike; essential item of food</text>

        <text x="15" y="136" class="card-text">• British tax on salt &amp; government</text>
        <text x="23" y="152" class="card-text">monopoly over production revealed</text>
        <text x="23" y="168" class="card-text"><tspan font-weight="700" fill="#c62828">oppressive face of British rule</tspan></text>

        <text x="15" y="192" class="card-text">• <tspan font-weight="700" fill="#7b1fa2">11 Demands (31 Jan 1930):</tspan></text>
        <text x="23" y="208" class="card-text">Gandhi sent letter to Viceroy Irwin;</text>
        <text x="23" y="224" class="card-text">key demand was to <tspan font-weight="700">abolish salt tax</tspan></text>

        <text x="15" y="248" class="card-text">• Irwin was unwilling to negotiate;</text>
        <text x="23" y="264" class="card-text">Gandhi launched historic Salt March</text>
    </g>

    <!-- Card 2: The Dandi March -->
    <g transform="translate(290, 70)" filter="url(#shadow10)">
        <rect width="220" height="355" rx="8" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#303f9f"/>
        <text x="82.5" y="31" class="badge">2. DANDI MARCH</text>
        <rect x="15" y="48" width="190" height="2" fill="#c5cae9"/>

        <text x="15" y="72" class="card-title" fill="#1a237e">240 Miles in 24 Days</text>

        <text x="15" y="96" class="card-text">• Started from Gandhi's ashram at</text>
        <text x="23" y="112" class="card-text"><tspan font-weight="700">Sabarmati</tspan> to coastal town of <tspan font-weight="700">Dandi</tspan></text>

        <text x="15" y="136" class="card-text">• Accompanied by <tspan font-weight="700" fill="#303f9f">78 trusted</tspan></text>
        <text x="23" y="152" class="card-text"><tspan font-weight="700" fill="#303f9f">volunteers</tspan>; marched 10 miles a day</text>

        <text x="15" y="176" class="card-text">• Thousands gathered at every stop to</text>
        <text x="23" y="192" class="card-text">listen to Gandhi explain Swaraj</text>

        <text x="15" y="216" class="card-text">• <tspan font-weight="800" fill="#2e7d32">6 April 1930:</tspan> Reached Dandi;</text>
        <text x="23" y="232" class="card-text">manufactured salt by boiling seawater</text>

        <text x="15" y="256" class="card-text">• <tspan font-weight="700" fill="#c62828">Violated colonial Salt Law</tspan></text>
    </g>

    <!-- Card 3: CDM Features & Pact -->
    <g transform="translate(540, 70)" filter="url(#shadow10)">
        <rect width="220" height="355" rx="8" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#2e7d32"/>
        <text x="87.5" y="31" class="badge">3. SPREAD &amp; PACT</text>
        <rect x="15" y="48" width="190" height="2" fill="#c8e6c9"/>

        <text x="15" y="72" class="card-title" fill="#1b5e20">Breaking Colonial Laws</text>

        <text x="15" y="96" class="card-text">• Difference from NCM: People asked</text>
        <text x="23" y="112" class="card-text">not only to refuse cooperation but to</text>
        <text x="23" y="128" class="card-text"><tspan font-weight="700" fill="#c62828">BREAK colonial laws</tspan></text>

        <text x="15" y="152" class="card-text">• Peasants refused revenue &amp; chaukidari</text>
        <text x="23" y="168" class="card-text">taxes; forest laws broken</text>

        <text x="15" y="192" class="card-text">• <tspan font-weight="700" fill="#d32f2f">Repression:</tspan> 100,000+ arrested;</text>
        <text x="23" y="208" class="card-text">Ghaffar Khan &amp; Gandhi jailed</text>

        <text x="15" y="232" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Gandhi-Irwin Pact (5 Mar 1931):</tspan></text>
        <text x="23" y="248" class="card-text">CDM called off; Gandhi attended</text>
        <text x="23" y="264" class="card-text">2nd Round Table Conf (London)</text>
    </g>
</svg>
