<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #e65100; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #f57c00; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e65100; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow12" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">THE SENSE OF COLLECTIVE BELONGING &amp; CULTURAL NATIONALISM</text>
    <text x="400" y="52" class="subtitle">How Symbolism, Folklore, History &amp; Flags United India</text>

    <!-- 4 Grid Cards (2x2 Grid) -->
    <!-- Card 1: Image of Bharat Mata -->
    <g transform="translate(40, 70)" filter="url(#shadow12)">
        <rect width="340" height="165" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="160" height="22" rx="11" fill="#e65100"/>
        <text x="95" y="30" class="badge">1. BHARAT MATA IMAGE</text>
        <text x="185" y="31" class="card-title">Bankim &amp; Abanindranath</text>
        <text x="15" y="60" class="card-text">• <tspan font-weight="700">Bankim Chandra Chattopadhyay:</tspan> Created identity</text>
        <text x="23" y="76" class="card-text">of nation with image of Bharat Mata; wrote <tspan font-weight="700" fill="#d32f2f">Vande Mataram</tspan></text>
        <text x="23" y="92" class="card-text">hymn (1870s), later included in novel <tspan font-style="italic" font-weight="700">Anandamath</tspan></text>
        <text x="15" y="114" class="card-text">• <tspan font-weight="700">Abanindranath Tagore:</tspan> Painted iconic Bharat Mata</text>
        <text x="23" y="130" class="card-text">as a calm, composed, divine, &amp; spiritual ascetic figure</text>
    </g>

    <!-- Card 2: Indian Folklore & Songs -->
    <g transform="translate(420, 70)" filter="url(#shadow12)">
        <rect width="340" height="165" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
        <rect x="15" y="15" width="160" height="22" rx="11" fill="#7b1fa2"/>
        <text x="95" y="30" class="badge">2. FOLKLORE &amp; TALES</text>
        <text x="185" y="31" class="card-title" fill="#6a1b9a">Restoring National Pride</text>
        <text x="15" y="60" class="card-text">• Nationalists recorded folk bards &amp; legends to revive</text>
        <text x="23" y="76" class="card-text">authentic traditional culture damaged by British</text>
        <text x="15" y="98" class="card-text">• <tspan font-weight="700">Rabindranath Tagore:</tspan> Collected ballads, nursery</text>
        <text x="23" y="114" class="card-text">rhymes &amp; myths; led folk revival movement in Bengal</text>
        <text x="15" y="136" class="card-text">• <tspan font-weight="700">Natesa Sastri:</tspan> Published 4-volume <tspan font-style="italic" font-weight="700">The Folklore of Southern India</tspan></text>
    </g>

    <!-- Card 3: Evolution of National Flags -->
    <g transform="translate(40, 250)" filter="url(#shadow12)">
        <rect width="340" height="165" rx="8" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
        <rect x="15" y="15" width="150" height="22" rx="11" fill="#2e7d32"/>
        <text x="90" y="30" class="badge">3. NATIONAL FLAGS</text>
        <text x="175" y="31" class="card-title" fill="#1b5e20">Swadeshi &amp; Swaraj Tricolors</text>
        <text x="15" y="60" class="card-text">• <tspan font-weight="700" fill="#e65100">Swadeshi Flag (1905 Bengal):</tspan> Tricolor (Red, Green,</text>
        <text x="23" y="76" class="card-text">Yellow) with 8 lotuses (provinces) &amp; crescent moon</text>
        <text x="15" y="98" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Swaraj Flag (1921 Gandhi):</tspan> Tricolor (Red, Green,</text>
        <text x="23" y="114" class="card-text">White) with a <tspan font-weight="700">Spinning Wheel (Charkha)</tspan> in center</text>
        <text x="23" y="130" class="card-text">symbolising Gandhian ideal of self-help</text>
    </g>

    <!-- Card 4: Reinterpretation of History -->
    <g transform="translate(420, 250)" filter="url(#shadow12)">
        <rect width="340" height="165" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
        <rect x="15" y="15" width="165" height="22" rx="11" fill="#1976d2"/>
        <text x="97.5" y="30" class="badge">4. REWRITING HISTORY</text>
        <text x="190" y="31" class="card-title" fill="#0d47a1">Glorious Ancient Past</text>
        <text x="15" y="60" class="card-text">• British saw Indians as backward, primitive &amp; incapable</text>
        <text x="23" y="76" class="card-text">of governing themselves</text>
        <text x="15" y="98" class="card-text">• Indian historians wrote about glorious achievements in</text>
        <text x="23" y="114" class="card-text">ancient times in art, architecture, science, math &amp; trade</text>
        <text x="15" y="136" class="card-text">• Instilled pride; urged people to fight colonial rule</text>
    </g>
</svg>
