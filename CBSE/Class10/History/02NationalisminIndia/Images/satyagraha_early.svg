<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #e65100; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #f57c00; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #e65100; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
            .quote-box { fill: #fff3e0; stroke: #ffb74d; stroke-width: 1.5; rx: 8px; }
            .quote-text { font-family: Georgia, serif; font-size: 13px; font-style: italic; fill: #bf360c; text-anchor: middle; }
        </style>
        <filter id="shadow3" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">MAHATMA GANDHI &amp; THE IDEA OF SATYAGRAHA</text>
    <text x="400" y="52" class="subtitle">Returned to India: January 1915 from South Africa</text>

    <!-- Center Philosophy Quote -->
    <rect x="50" y="68" width="700" height="70" class="quote-box" filter="url(#shadow3)"/>
    <text x="400" y="94" class="quote-text">"Satyagraha is not physical force. A satyagrahi does not inflict pain on the adversary;</text>
    <text x="400" y="114" class="quote-text">he does not seek his destruction... Truth is the very substance of the soul."</text>

    <!-- 3 Early Satyagraha Movements Grid -->
    <!-- Movement 1: Champaran 1917 -->
    <g transform="translate(40, 160)" filter="url(#shadow3)">
        <rect width="220" height="255" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="120" height="24" rx="12" fill="#e65100"/>
        <text x="75" y="31" class="badge">1. CHAMPAAN (1917)</text>
        
        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>
        <text x="15" y="72" class="card-title">Bihar Peasant Movement</text>
        
        <text x="15" y="100" class="card-text">• <tspan font-weight="700" fill="#e65100">Location:</tspan> Champaran, Bihar</text>
        <text x="15" y="122" class="card-text">• <tspan font-weight="700" fill="#e65100">Cause:</tspan> Oppressive Tinkathia</text>
        <text x="23" y="138" class="card-text">indigo plantation system</text>
        <text x="15" y="160" class="card-text">• Forced to grow indigo on 3/20th</text>
        <text x="23" y="176" class="card-text">of land for British planters</text>
        <text x="15" y="198" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Outcome:</tspan> First successful</text>
        <text x="23" y="214" class="card-text">Satyagraha in India; commission</text>
        <text x="23" y="230" class="card-text">abolished forced indigo farming</text>
    </g>

    <!-- Movement 2: Kheda 1917 -->
    <g transform="translate(290, 160)" filter="url(#shadow3)">
        <rect width="220" height="255" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="110" height="24" rx="12" fill="#f57c00"/>
        <text x="70" y="31" class="badge">2. KHEDA (1917)</text>

        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>
        <text x="15" y="72" class="card-title">Gujarat Peasant Struggle</text>

        <text x="15" y="100" class="card-text">• <tspan font-weight="700" fill="#e65100">Location:</tspan> Kheda district, Gujarat</text>
        <text x="15" y="122" class="card-text">• <tspan font-weight="700" fill="#e65100">Cause:</tspan> Crop failure &amp; plague</text>
        <text x="23" y="138" class="card-text">epidemic hit farmers hard</text>
        <text x="15" y="160" class="card-text">• Peasants could not pay revenue</text>
        <text x="23" y="176" class="card-text">demanded revenue relaxation</text>
        <text x="15" y="198" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Outcome:</tspan> Govt relaxed revenue</text>
        <text x="23" y="214" class="card-text">collection; Sardar Patel joined</text>
        <text x="23" y="230" class="card-text">Gandhiji in leadership</text>
    </g>

    <!-- Movement 3: Ahmedabad 1918 -->
    <g transform="translate(540, 160)" filter="url(#shadow3)">
        <rect width="220" height="255" rx="8" fill="#ffffff" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="140" height="24" rx="12" fill="#ef6c00"/>
        <text x="85" y="31" class="badge">3. AHMEDABAD (1918)</text>

        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>
        <text x="15" y="72" class="card-title">Cotton Mill Strike</text>

        <text x="15" y="100" class="card-text">• <tspan font-weight="700" fill="#e65100">Location:</tspan> Ahmedabad, Gujarat</text>
        <text x="15" y="122" class="card-text">• <tspan font-weight="700" fill="#e65100">Cause:</tspan> Dispute between cotton</text>
        <text x="23" y="138" class="card-text">mill owners &amp; workers</text>
        <text x="15" y="160" class="card-text">• Workers demanded 35% wage hike</text>
        <text x="23" y="176" class="card-text">after plague bonus was withdrawn</text>
        <text x="15" y="198" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Outcome:</tspan> Gandhi undertook hunger</text>
        <text x="23" y="214" class="card-text">strike; owners agreed to full</text>
        <text x="23" y="230" class="card-text">35% wage increase for workers</text>
    </g>
</svg>
