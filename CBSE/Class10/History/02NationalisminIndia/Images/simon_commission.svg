<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #d32f2f; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #b71c1c; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #b71c1c; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow9" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">TOWARDS CIVIL DISOBEDIENCE (1922 – 1929)</text>
    <text x="400" y="52" class="subtitle">Chauri Chaura, Swaraj Party, Simon Commission &amp; Lahore Congress</text>

    <!-- 3 Step Sequence Cards -->
    <!-- Card 1: Chauri Chaura & Swaraj Party -->
    <g transform="translate(40, 70)" filter="url(#shadow9)">
        <rect width="220" height="355" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#c62828"/>
        <text x="82.5" y="31" class="badge">1. FEB 1922 &amp; 1923</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffcdd2"/>

        <text x="15" y="72" class="card-title" fill="#b71c1c">Withdrawal &amp; New Path</text>

        <text x="15" y="96" class="card-text">• <tspan font-weight="700" fill="#c62828">Chauri Chaura (Feb 1922):</tspan></text>
        <text x="23" y="112" class="card-text">Peaceful crowd clashed with police in</text>
        <text x="23" y="128" class="card-text">Gorakhpur; 22 police burned alive</text>

        <text x="15" y="152" class="card-text">• Gandhi called off NCM immediately,</text>
        <text x="23" y="168" class="card-text">stating satyagrahis needed training</text>

        <text x="15" y="192" class="card-text">• <tspan font-weight="700" fill="#1565c0">Swaraj Party (1923):</tspan> Formed by</text>
        <text x="23" y="208" class="card-text"><tspan font-weight="700">C.R. Das</tspan> &amp; <tspan font-weight="700">Motilal Nehru</tspan> to</text>
        <text x="23" y="224" class="card-text">contest council elections &amp; oppose</text>
        <text x="23" y="240" class="card-text">British policies from within</text>

        <text x="15" y="264" class="card-text">• Younger leaders like Jawaharlal</text>
        <text x="23" y="280" class="card-text">Nehru &amp; Subhas Chandra Bose</text>
        <text x="23" y="296" class="card-text">pressed for full independence</text>
    </g>

    <!-- Card 2: Simon Commission (1928) -->
    <g transform="translate(290, 70)" filter="url(#shadow9)">
        <rect width="220" height="355" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#e65100"/>
        <text x="87.5" y="31" class="badge">2. SIMON COMMISSION</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>

        <text x="15" y="72" class="card-title" fill="#e65100">"Go Back Simon!" (1928)</text>

        <text x="15" y="96" class="card-text">• Set up by Tory govt under <tspan font-weight="700">Sir</tspan></text>
        <text x="23" y="112" class="card-text"><tspan font-weight="700">John Simon</tspan> to review constitutional</text>
        <text x="23" y="128" class="card-text">system in India &amp; suggest changes</text>

        <text x="15" y="152" class="card-text">• <tspan font-weight="700" fill="#c62828">The Flaw:</tspan> It had <tspan font-weight="700" fill="#c62828">NO Indian member</tspan>;</text>
        <text x="23" y="168" class="card-text">all members were British!</text>

        <text x="15" y="192" class="card-text">• Greeted with black flags &amp; shouts of</text>
        <text x="23" y="208" class="card-text"><tspan font-weight="800" fill="#d32f2f">"Go Back Simon!"</tspan> when it arrived</text>

        <text x="15" y="232" class="card-text">• All parties (Congress &amp; Muslim</text>
        <text x="23" y="248" class="card-text">League) joined demonstrations</text>

        <text x="15" y="272" class="card-text">• Lala Lajpat Rai succumbed to lathi</text>
        <text x="23" y="288" class="card-text">charge wounds in Lahore (1928)</text>
    </g>

    <!-- Card 3: Purna Swaraj (1929) -->
    <g transform="translate(540, 70)" filter="url(#shadow9)">
        <rect width="220" height="355" rx="8" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#2e7d32"/>
        <text x="87.5" y="31" class="badge">3. PURNA SWARAJ</text>
        <rect x="15" y="48" width="190" height="2" fill="#c8e6c9"/>

        <text x="15" y="72" class="card-title" fill="#1b5e20">Lahore Session (Dec 1929)</text>

        <text x="15" y="96" class="card-text">• Viceroy Lord Irwin offered vague</text>
        <text x="23" y="112" class="card-text">'Dominion Status' offer in Oct 1929;</text>
        <text x="23" y="128" class="card-text">rejected by radicals in Congress</text>

        <text x="15" y="152" class="card-text">• <tspan font-weight="700" fill="#1b5e20">Lahore Congress (Dec 1929):</tspan></text>
        <text x="23" y="168" class="card-text">Presided over by <tspan font-weight="700">Jawaharlal Nehru</tspan></text>

        <text x="15" y="192" class="card-text">• Formalized the demand for</text>
        <text x="23" y="208" class="card-text"><tspan font-weight="800" fill="#1b5e20">'PURNA SWARAJ'</tspan> (Complete</text>
        <text x="23" y="224" class="card-text">Independence for India)</text>

        <text x="15" y="248" class="card-text">• Declared <tspan font-weight="700" fill="#d32f2f">26 January 1930</tspan> as</text>
        <text x="23" y="264" class="card-text">Independence Day; people took pledge</text>
        <text x="23" y="280" class="card-text">to fight for complete independence</text>
    </g>
</svg>
