<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #1a237e; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5c6bc0; text-anchor: middle; font-style: italic; }
            .header-box { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
            .sub-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #37474f; text-anchor: middle; letter-spacing: 1px; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0d47a1; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .year-badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
            .arrow { stroke: #90a4ae; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrowhead); }
        </style>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#78909c"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect class="bg" width="900" height="650" rx="12"/>

    <!-- Main Title -->
    <text x="450" y="38" class="title">CHAPTER 2: NATIONALISM IN INDIA (1914 – 1934)</text>
    <text x="450" y="58" class="subtitle">Complete Timeline &amp; Key Movements Flowchart</text>

    <!-- COL 1: 1914 - 1919 (BLUE) -->
    <rect x="30" y="80" width="260" height="42" rx="6" fill="#1565c0" filter="url(#shadow)"/>
    <text x="160" y="100" class="header-box">1. WAR &amp; EARLY SATYAGRAHA</text>
    <text x="160" y="115" class="header-box" font-size="11px" opacity="0.9">(1914 – 1919)</text>

    <rect x="30" y="132" width="260" height="500" rx="8" fill="#f4f7fa" stroke="#bbdefb" stroke-width="1.5"/>

    <!-- Col 1 Cards -->
    <!-- Card 1.1 -->
    <rect x="42" y="145" width="236" height="85" rx="6" fill="#ffffff" stroke="#90caf9" stroke-width="1"/>
    <rect x="52" y="153" width="75" height="18" rx="9" fill="#1976d2"/>
    <text x="89.5" y="166" class="year-badge">1914-1918</text>
    <text x="135" y="166" class="card-title">World War I Hardships</text>
    <text x="52" y="186" class="card-text">• Taxes raised, forced recruitment</text>
    <text x="52" y="201" class="card-text">• Price doubling &amp; influenza epidemic</text>

    <!-- Card 1.2 -->
    <rect x="42" y="242" width="236" height="110" rx="6" fill="#ffffff" stroke="#90caf9" stroke-width="1"/>
    <rect x="52" y="250" width="75" height="18" rx="9" fill="#0288d1"/>
    <text x="89.5" y="263" class="year-badge">1915-1918</text>
    <text x="135" y="263" class="card-title">Idea of Satyagraha</text>
    <text x="52" y="283" class="card-text">• Gandhiji returns from S. Africa (1915)</text>
    <text x="52" y="298" class="card-text">• <tspan font-weight="bold" fill="#0288d1">Champaran (1917):</tspan> Indigo farmers</text>
    <text x="52" y="313" class="card-text">• <tspan font-weight="bold" fill="#0288d1">Kheda (1917):</tspan> Crop failure relaxation</text>
    <text x="52" y="328" class="card-text">• <tspan font-weight="bold" fill="#0288d1">Ahmedabad (1918):</tspan> Cotton mill strike</text>

    <!-- Card 1.3 -->
    <rect x="42" y="364" width="236" height="120" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1"/>
    <rect x="52" y="372" width="55" height="18" rx="9" fill="#d32f2f"/>
    <text x="79.5" y="385" class="year-badge">1919</text>
    <text x="115" y="385" class="card-title" fill="#c62828">Rowlatt Act &amp; Massacre</text>
    <text x="52" y="405" class="card-text">• Detention without trial for 2 years</text>
    <text x="52" y="420" class="card-text">• Nationwide Hartal (6 April 1919)</text>
    <text x="52" y="435" class="card-text">• <tspan font-weight="bold" fill="#c62828">Jallianwala Bagh (13 April):</tspan></text>
    <text x="60" y="450" class="card-text">Gen. Dyer opened fire on crowd</text>
    <text x="52" y="468" class="card-text">• Martial law imposed across Punjab</text>

    <!-- Card 1.4 -->
    <rect x="42" y="496" width="236" height="120" rx="6" fill="#ffffff" stroke="#ce93d8" stroke-width="1"/>
    <rect x="52" y="504" width="85" height="18" rx="9" fill="#7b1fa2"/>
    <text x="94.5" y="517" class="year-badge">1919-1920</text>
    <text x="143" y="517" class="card-title" fill="#6a1b9a">Khilafat Committee</text>
    <text x="52" y="537" class="card-text">• Formed in Bombay by Ali brothers</text>
    <text x="52" y="552" class="card-text">• To protect Ottoman Caliph's power</text>
    <text x="52" y="567" class="card-text">• Gandhi sees chance for Hindu-Muslim</text>
    <text x="60" y="582" class="card-text">unity for combined movement</text>
    <text x="52" y="600" class="card-text">• Calcutta Congress (Sept 1920)</text>


    <!-- COL 2: 1920 - 1922 (YELLOW/ORANGE) -->
    <rect x="320" y="80" width="260" height="42" rx="6" fill="#f57c00" filter="url(#shadow)"/>
    <text x="450" y="100" class="header-box">2. NON-COOPERATION</text>
    <text x="450" y="115" class="header-box" font-size="11px" opacity="0.9">(1920 – 1922)</text>

    <rect x="320" y="132" width="260" height="500" rx="8" fill="#fffde7" stroke="#ffe082" stroke-width="1.5"/>

    <!-- Col 2 Cards -->
    <!-- Card 2.1 -->
    <rect x="332" y="145" width="236" height="95" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
    <rect x="342" y="153" width="75" height="18" rx="9" fill="#e65100"/>
    <text x="379.5" y="166" class="year-badge">DEC 1920</text>
    <text x="425" y="166" class="card-title" fill="#e65100">Nagpur Congress Session</text>
    <text x="342" y="186" class="card-text">• Non-Cooperation program adopted</text>
    <text x="342" y="201" class="card-text">• Surrender of titles &amp; honors</text>
    <text x="342" y="216" class="card-text">• Boycott of schools, courts &amp; goods</text>

    <!-- Card 2.2 -->
    <rect x="332" y="252" width="236" height="110" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1"/>
    <rect x="342" y="260" width="85" height="18" rx="9" fill="#f57c00"/>
    <text x="384.5" y="273" class="year-badge">1921-1922</text>
    <text x="435" y="273" class="card-title" fill="#ef6c00">Strands of Struggle</text>
    <text x="342" y="293" class="card-text">• <tspan font-weight="bold" fill="#ef6c00">Towns:</tspan> Students leave schools,</text>
    <text x="350" y="306" class="card-text">cloth imports drop by 50%</text>
    <text x="342" y="321" class="card-text">• <tspan font-weight="bold" fill="#ef6c00">Countryside:</tspan> Awadh peasants (Baba</text>
    <text x="350" y="334" class="card-text">Ramchandra) &amp; Gudem Hills tribals</text>
    <text x="342" y="349" class="card-text">• <tspan font-weight="bold" fill="#ef6c00">Plantations:</tspan> Defied Emigration Act</text>

    <!-- Card 2.3 -->
    <rect x="332" y="374" width="236" height="105" rx="6" fill="#ffffff" stroke="#ef9a9a" stroke-width="1"/>
    <rect x="342" y="382" width="75" height="18" rx="9" fill="#c62828"/>
    <text x="379.5" y="395" class="year-badge">FEB 1922</text>
    <text x="425" y="395" class="card-title" fill="#b71c1c">Chauri Chaura Incident</text>
    <text x="342" y="415" class="card-text">• Peaceful protest turned violent in UP</text>
    <text x="342" y="430" class="card-text">• 22 policemen killed in station fire</text>
    <text x="342" y="445" class="card-text">• <tspan font-weight="bold" fill="#b71c1c">Gandhiji withdraws NCM</tspan> citing</text>
    <text x="350" y="460" class="card-text">need for training in non-violence</text>

    <!-- Card 2.4 -->
    <rect x="332" y="491" width="236" height="125" rx="6" fill="#ffffff" stroke="#b0bec5" stroke-width="1"/>
    <rect x="342" y="499" width="85" height="18" rx="9" fill="#455a64"/>
    <text x="384.5" y="512" class="year-badge">1923-1929</text>
    <text x="435" y="512" class="card-title" fill="#37474f">Swaraj Party &amp; Simon</text>
    <text x="342" y="532" class="card-text">• C.R. Das &amp; Motilal form Swaraj Party</text>
    <text x="342" y="547" class="card-text">• <tspan font-weight="bold" fill="#37474f">1928:</tspan> Simon Commission arrives</text>
    <text x="350" y="560" class="card-text">Greeted with <tspan font-weight="bold" stroke="#d32f2f" fill="#d32f2f">"Go Back Simon"</tspan></text>
    <text x="342" y="577" class="card-text">• <tspan font-weight="bold" fill="#37474f">1929:</tspan> Lahore Session (Nehru)</text>
    <text x="350" y="592" class="card-text">Demand for <tspan font-weight="bold" fill="#1b5e20">Purna Swaraj</tspan></text>


    <!-- COL 3: 1930 - 1934 (GREEN) -->
    <rect x="610" y="80" width="260" height="42" rx="6" fill="#2e7d32" filter="url(#shadow)"/>
    <text x="740" y="100" class="header-box">3. CIVIL DISOBEDIENCE</text>
    <text x="740" y="115" class="header-box" font-size="11px" opacity="0.9">(1930 – 1934)</text>

    <rect x="610" y="132" width="260" height="500" rx="8" fill="#f1f8e9" stroke="#c8e6c9" stroke-width="1.5"/>

    <!-- Col 3 Cards -->
    <!-- Card 3.1 -->
    <rect x="622" y="145" width="236" height="110" rx="6" fill="#ffffff" stroke="#81c784" stroke-width="1"/>
    <rect x="632" y="153" width="85" height="18" rx="9" fill="#2e7d32"/>
    <text x="674.5" y="166" class="year-badge">MAR-APR 1930</text>
    <text x="725" y="166" class="card-title" fill="#1b5e20">Dandi Salt March</text>
    <text x="632" y="186" class="card-text">• 240 miles (Sabarmati to Dandi)</text>
    <text x="632" y="201" class="card-text">• 78 trusted volunteers, 24 days</text>
    <text x="632" y="216" class="card-text">• <tspan font-weight="bold" fill="#2e7d32">6 April 1930:</tspan> Broke Salt Law</text>
    <text x="632" y="231" class="card-text">• Marks start of Civil Disobedience</text>

    <!-- Card 3.2 -->
    <rect x="622" y="267" width="236" height="110" rx="6" fill="#ffffff" stroke="#81c784" stroke-width="1"/>
    <rect x="632" y="275" width="75" height="18" rx="9" fill="#388e3c"/>
    <text x="669.5" y="288" class="year-badge">1930-1931</text>
    <text x="715" y="288" class="card-title" fill="#1b5e20">CDM Spread &amp; Pact</text>
    <text x="632" y="308" class="card-text">• Boycott of foreign cloth &amp; liquor</text>
    <text x="632" y="323" class="card-text">• Forest law violations across India</text>
    <text x="632" y="338" class="card-text">• <tspan font-weight="bold" fill="#1b5e20">5 Mar 1931:</tspan> Gandhi-Irwin Pact</text>
    <text x="632" y="353" class="card-text">• Gandhi attends 2nd Round Table</text>

    <!-- Card 3.3 -->
    <rect x="622" y="389" width="236" height="105" rx="6" fill="#ffffff" stroke="#ce93d8" stroke-width="1"/>
    <rect x="632" y="397" width="55" height="18" rx="9" fill="#8e24aa"/>
    <text x="659.5" y="410" class="year-badge">1932</text>
    <text x="695" y="410" class="card-title" fill="#4a148c">The Poona Pact</text>
    <text x="632" y="430" class="card-text">• Ambedkar &amp; Gandhi agreement</text>
    <text x="632" y="445" class="card-text">• Reserved seats for Dalits in councils</text>
    <text x="632" y="460" class="card-text">• Joint electorate retained</text>
    <text x="632" y="475" class="card-text">• Dalits called 'Harijans' by Gandhi</text>

    <!-- Card 3.4 -->
    <rect x="622" y="506" width="236" height="110" rx="6" fill="#ffffff" stroke="#81c784" stroke-width="1"/>
    <rect x="632" y="514" width="85" height="18" rx="9" fill="#1b5e20"/>
    <text x="674.5" y="527" class="year-badge">1932-1934</text>
    <text x="725" y="527" class="card-title" fill="#1b5e20">Relaunch &amp; Decline</text>
    <text x="632" y="547" class="card-text">• Movement relaunched in 1932</text>
    <text x="632" y="562" class="card-text">• Lost momentum by 1934</text>
    <text x="632" y="577" class="card-text">• <tspan font-weight="bold" fill="#1b5e20">Cultural Unity:</tspan> Bharat Mata,</text>
    <text x="640" y="592" class="card-text">Vande Mataram, Tricolour flag</text>


    <!-- Horizontal Arrows between columns -->
    <line x1="295" y1="200" x2="315" y2="200" class="arrow"/>
    <line x1="295" y1="420" x2="315" y2="420" class="arrow"/>
    <line x1="585" y1="200" x2="605" y2="200" class="arrow"/>
    <line x1="585" y1="420" x2="605" y2="420" class="arrow"/>

</svg>
