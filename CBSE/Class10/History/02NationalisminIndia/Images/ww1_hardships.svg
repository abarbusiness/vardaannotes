<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #1565c0; text-anchor: middle; }
            .box-bg { fill: #f5f7fa; stroke: #90caf9; stroke-width: 1.5; rx: 8px; }
            .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0d47a1; }
            .box-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #37474f; }
            .highlight { font-weight: 700; fill: #d32f2f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow2" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="36" class="heading">IMPACT OF THE FIRST WORLD WAR ON INDIA (1914 – 1918)</text>

    <!-- 4 Key Grid Cards -->
    <!-- Card 1: Economic Hardships -->
    <g transform="translate(40, 60)" filter="url(#shadow2)">
        <rect width="340" height="165" class="box-bg"/>
        <rect x="15" y="15" width="120" height="22" rx="11" fill="#1976d2"/>
        <text x="75" y="30" class="badge">ECONOMIC IMPACT</text>
        <text x="145" y="31" class="box-title">War Expenses &amp; Taxes</text>
        <text x="15" y="60" class="box-desc">• Huge increase in defense expenditure</text>
        <text x="15" y="80" class="box-desc">• Customs duties were raised significantly</text>
        <text x="15" y="100" class="box-desc">• <tspan class="highlight">Income Tax introduced</tspan> for the first time</text>
        <text x="15" y="120" class="box-desc">• War loans taken by British government</text>
        <text x="15" y="140" class="box-desc">• Prices doubled between 1913 and 1918</text>
    </g>

    <!-- Card 2: Social & Forced Recruitment -->
    <g transform="translate(420, 60)" filter="url(#shadow2)">
        <rect width="340" height="165" class="box-bg" style="stroke: #ffb74d; fill: #fff8e1;"/>
        <rect x="15" y="15" width="135" height="22" rx="11" fill="#e65100"/>
        <text x="82.5" y="30" class="badge">FORCED RECRUITMENT</text>
        <text x="160" y="31" class="box-title" fill="#e65100">Anger in Rural Areas</text>
        <text x="15" y="60" class="box-desc">• Villagers forcibly drafted into British Army</text>
        <text x="15" y="80" class="box-desc">• Sent to fight in Europe, Middle East &amp; Africa</text>
        <text x="15" y="100" class="box-desc">• Caused <tspan class="highlight">widespread anger</tspan> in Indian villages</text>
        <text x="15" y="120" class="box-desc">• Disruption of rural agricultural workforce</text>
        <text x="15" y="140" class="box-desc">• Fuelled anti-colonial sentiments</text>
    </g>

    <!-- Card 3: Crop Failure & Famine -->
    <g transform="translate(40, 250)" filter="url(#shadow2)">
        <rect width="340" height="165" class="box-bg" style="stroke: #ef9a9a; fill: #ffebee;"/>
        <rect x="15" y="15" width="125" height="22" rx="11" fill="#c62828"/>
        <text x="77.5" y="30" class="badge">CROP FAILURE</text>
        <text x="150" y="31" class="box-title" fill="#c62828">Severe Food Shortage</text>
        <text x="15" y="60" class="box-desc">• Severe crop failures in 1918-19 &amp; 1920-21</text>
        <text x="15" y="80" class="box-desc">• Led to acute acute food shortages across India</text>
        <text x="15" y="100" class="box-desc">• Prices of basic food grains skyrocketed</text>
        <text x="15" y="120" class="box-desc">• Peasantry pushed into deep poverty &amp; debt</text>
        <text x="15" y="140" class="box-desc">• Mass starvation in many provinces</text>
    </g>

    <!-- Card 4: Influenza Epidemic -->
    <g transform="translate(420, 250)" filter="url(#shadow2)">
        <rect width="340" height="165" class="box-bg" style="stroke: #ce93d8; fill: #f3e5f5;"/>
        <rect x="15" y="15" width="135" height="22" rx="11" fill="#6a1b9a"/>
        <text x="82.5" y="30" class="badge">INFLUENZA EPIDEMIC</text>
        <text x="160" y="31" class="box-title" fill="#6a1b9a">12–13 Million Deaths</text>
        <text x="15" y="60" class="box-desc">• 1921 Census recorded massive death toll</text>
        <text x="15" y="80" class="box-desc">• <tspan class="highlight">12 to 13 million people died</tspan> (famine + flu)</text>
        <text x="15" y="100" class="box-desc">• Total lack of colonial healthcare relief</text>
        <text x="15" y="120" class="box-desc">• People hoped hardship would end after war</text>
        <text x="15" y="140" class="box-desc">• But hardships continued, leading to revolt</text>
    </g>
</svg>
