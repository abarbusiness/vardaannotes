<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #c62828; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #d32f2f; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #b71c1c; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow4" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="460" rx="10"/>

    <text x="400" y="34" class="heading">ROWLATT ACT &amp; JALLIANWALA BAGH MASSACRE (1919)</text>
    <text x="400" y="52" class="subtitle">Turning point in the Indian Freedom Struggle</text>

    <!-- 3 Step Sequence Cards -->
    <!-- Step 1: Rowlatt Act -->
    <g transform="translate(40, 70)" filter="url(#shadow4)">
        <rect width="220" height="360" rx="8" fill="#fffde7" stroke="#ffd54f" stroke-width="1.5"/>
        <rect x="15" y="15" width="125" height="24" rx="12" fill="#f57f17"/>
        <text x="77.5" y="31" class="badge">1. ROWLATT ACT</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffe082"/>

        <text x="15" y="72" class="card-title" fill="#e65100">"Black Act" (March 1919)</text>
        <text x="15" y="98" class="card-text">• Officially named <tspan font-weight="700">Anarchical</tspan></text>
        <text x="23" y="114" class="card-text"><tspan font-weight="700">&amp; Revolutionary Crimes Act</tspan></text>
        <text x="15" y="136" class="card-text">• Imperial Legislative Council</text>
        <text x="23" y="152" class="card-text">passed it hurriedly despite Indian</text>
        <text x="23" y="168" class="card-text">members' united opposition</text>

        <text x="15" y="196" class="card-title" fill="#e65100">Key Provisions:</text>
        <text x="15" y="218" class="card-text">• Enormous powers to repress</text>
        <text x="23" y="234" class="card-text">all political activities</text>
        <text x="15" y="254" class="card-text">• <tspan font-weight="700" fill="#d32f2f">Detention without trial</tspan></text>
        <text x="23" y="270" class="card-text">for up to 2 years</text>
        <text x="15" y="292" class="card-text">• <tspan font-weight="700">No Appeal, No Dalil, No Vakil</tspan></text>

        <text x="15" y="320" class="card-text">• Gandhi called for <tspan font-weight="700" fill="#d32f2f">Rowlatt Satyagraha</tspan></text>
        <text x="23" y="336" class="card-text">Hartal on 6 April 1919</text>
    </g>

    <!-- Step 2: Amritsar Protests & Martial Law -->
    <g transform="translate(290, 70)" filter="url(#shadow4)">
        <rect width="220" height="360" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="140" height="24" rx="12" fill="#e65100"/>
        <text x="85" y="31" class="badge">2. RISING TENSION</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffcc80"/>

        <text x="15" y="72" class="card-title">Events Leading to April 13</text>
        <text x="15" y="98" class="card-text">• <tspan font-weight="700">Rallies &amp; Strikes:</tspan> Workers went</text>
        <text x="23" y="114" class="card-text">on strike in railway workshops;</text>
        <text x="23" y="130" class="card-text">shops shut down in Amritsar</text>

        <text x="15" y="156" class="card-text">• <tspan font-weight="700">Leaders Arrested:</tspan> Dr. Saifuddin</text>
        <text x="23" y="172" class="card-text">Kitchlew &amp; Dr. Satyapal arrested</text>
        <text x="23" y="188" class="card-text">in Amritsar; Gandhi barred from Delhi</text>

        <text x="15" y="214" class="card-text">• <tspan font-weight="700">April 10 Firing:</tspan> Police fired</text>
        <text x="23" y="230" class="card-text">on peaceful procession in Amritsar</text>

        <text x="15" y="256" class="card-text">• Provoked attacks on banks, post</text>
        <text x="23" y="272" class="card-text">offices &amp; railway stations</text>

        <text x="15" y="298" class="card-text">• <tspan font-weight="700" fill="#d32f2f">Martial Law Imposed:</tspan></text>
        <text x="23" y="314" class="card-text">Command handed over to</text>
        <text x="23" y="330" class="card-text"><tspan font-weight="700" fill="#d32f2f">Brigadier-General Dyer</tspan></text>
    </g>

    <!-- Step 3: Jallianwala Bagh Massacre -->
    <g transform="translate(540, 70)" filter="url(#shadow4)">
        <rect width="220" height="360" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#c62828"/>
        <text x="87.5" y="31" class="badge">3. THE MASSACRE</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffcdd2"/>

        <text x="15" y="72" class="card-title" fill="#b71c1c">13 April 1919 (Baisakhi)</text>
        <text x="15" y="98" class="card-text">• Large crowd gathered in ground</text>
        <text x="23" y="114" class="card-text">outside Amritsar (Jallianwala Bagh)</text>

        <text x="15" y="136" class="card-text">• Some came to protest leader arrests;</text>
        <text x="23" y="152" class="card-text">many villagers came for annual</text>
        <text x="23" y="168" class="card-text">Baisakhi fair unaware of martial law</text>

        <text x="15" y="194" class="card-text">• <tspan font-weight="700" fill="#c62828">Dyer Blocked Exit:</tspan> Only narrow</text>
        <text x="23" y="210" class="card-text">entry/exit gate blocked by troops</text>

        <text x="15" y="232" class="card-text">• <tspan font-weight="700" fill="#c62828">Fired Unarmed Crowd:</tspan> 1,650</text>
        <text x="23" y="248" class="card-text">rounds fired; hundreds killed</text>

        <text x="15" y="274" class="card-text">• <tspan font-weight="700">Dyer's Stated Objective:</tspan></text>
        <text x="23" y="290" class="card-text">"To produce a moral effect &amp; create</text>
        <text x="23" y="306" class="card-text">a feeling of terror in satyagrahis"</text>

        <text x="15" y="330" class="card-text">• <tspan font-weight="700" fill="#c62828">Rabindranath Tagore</tspan> renounced</text>
        <text x="23" y="346" class="card-text">his Knighthood in protest</text>
    </g>
</svg>
