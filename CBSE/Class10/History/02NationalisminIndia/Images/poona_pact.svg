<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #4a148c; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #7b1fa2; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #4a148c; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow11" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">LIMITS OF CIVIL DISOBEDIENCE &amp; THE POONA PACT (1932)</text>
    <text x="400" y="52" class="subtitle">Social Divisions: Dalits &amp; Muslim Alienation</text>

    <!-- 3 Grid Column Cards -->
    <!-- Card 1: Dalit Participation & Ambedkar -->
    <g transform="translate(40, 70)" filter="url(#shadow11)">
        <rect width="220" height="355" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#7b1fa2"/>
        <text x="87.5" y="31" class="badge">1. DALIT STRUGGLE</text>
        <rect x="15" y="48" width="190" height="2" fill="#e1bee7"/>

        <text x="15" y="72" class="card-title">Dr. B.R. Ambedkar</text>

        <text x="15" y="96" class="card-text">• For long, Congress ignored Dalits</text>
        <text x="23" y="112" class="card-text">fearing conservative high-caste Hindus</text>

        <text x="15" y="136" class="card-text">• <tspan font-weight="700" fill="#7b1fa2">Gandhiji's View:</tspan> Called Dalits</text>
        <text x="23" y="152" class="card-text"><tspan font-weight="700" fill="#2e7d32">'Harijans'</tspan> (children of God); organized</text>
        <text x="23" y="168" class="card-text">satyagraha for temple entry &amp; water rights</text>

        <text x="15" y="192" class="card-text">• <tspan font-weight="700" fill="#7b1fa2">Dr. B.R. Ambedkar:</tspan> Formed</text>
        <text x="23" y="208" class="card-text"><tspan font-weight="700">Depressed Classes Association</tspan></text>
        <text x="23" y="224" class="card-text">in 1930; demanded political rights &amp;</text>
        <text x="23" y="240" class="card-text"><tspan font-weight="700" fill="#c62828">Separate Electorates</tspan> for Dalits</text>

        <text x="15" y="264" class="card-text">• British accepted separate electorate</text>
        <text x="23" y="280" class="card-text">demand at 2nd Round Table Conference</text>
    </g>

    <!-- Card 2: The Poona Pact (Sept 1932) -->
    <g transform="translate(290, 70)" filter="url(#shadow11)">
        <rect width="220" height="355" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#e65100"/>
        <text x="82.5" y="31" class="badge">2. POONA PACT</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>

        <text x="15" y="72" class="card-title" fill="#e65100">September 1932 Agreement</text>

        <text x="15" y="96" class="card-text">• Gandhi began <tspan font-weight="700" fill="#c62828">fast unto death</tspan> in</text>
        <text x="23" y="112" class="card-text">Yerwada Jail against separate electorates,</text>
        <text x="23" y="128" class="card-text">believing it would permanently divide society</text>

        <text x="15" y="152" class="card-text">• Ambedkar ultimately accepted Gandhi's</text>
        <text x="23" y="168" class="card-text">position; signed <tspan font-weight="700" fill="#e65100">Poona Pact</tspan></text>

        <text x="15" y="192" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Key Resolution:</tspan> Depressed Classes</text>
        <text x="23" y="208" class="card-text">given <tspan font-weight="700">reserved seats</tspan> in provincial &amp;</text>
        <text x="23" y="224" class="card-text">central legislative councils</text>

        <text x="15" y="248" class="card-text">• But they were to be voted in by</text>
        <text x="23" y="264" class="card-text"><tspan font-weight="700" fill="#1b5e20">general electorate</tspan> (not separate)</text>
    </g>

    <!-- Card 3: Muslim Alienation -->
    <g transform="translate(540, 70)" filter="url(#shadow11)">
        <rect width="220" height="355" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#c62828"/>
        <text x="87.5" y="31" class="badge">3. MUSLIM ALIENATION</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffcdd2"/>

        <text x="15" y="72" class="card-title" fill="#b71c1c">Reluctance in Movement</text>

        <text x="15" y="96" class="card-text">• After decline of Khilafat movement,</text>
        <text x="23" y="112" class="card-text">large section of Muslims felt alienated</text>
        <text x="23" y="128" class="card-text">from the Congress party</text>

        <text x="15" y="152" class="card-text">• Congress came to be visibly associated</text>
        <text x="23" y="168" class="card-text">with Hindu religious nationalist groups</text>
        <text x="23" y="184" class="card-text">like the <tspan font-weight="700">Hindu Mahasabha</tspan></text>

        <text x="15" y="208" class="card-text">• <tspan font-weight="700">Attempted Compromise (1928):</tspan></text>
        <text x="23" y="224" class="card-text">Jinnah agreed to give up separate</text>
        <text x="23" y="240" class="card-text">electorates if reserved seats guaranteed</text>

        <text x="15" y="264" class="card-text">• Negotiation failed at All Parties Conf</text>
        <text x="23" y="280" class="card-text">when <tspan font-weight="700" fill="#c62828">M.R. Jayakar</tspan> strongly opposed</text>
    </g>
</svg>
