<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #2e7d32; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #388e3c; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1b5e20; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow7" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">REBELLION IN THE COUNTRYSIDE (1920 – 1922)</text>
    <text x="400" y="52" class="subtitle">Peasant Movement in Awadh &amp; Guerrilla Warfare in Gudem Hills</text>

    <!-- 2 Main Columns -->
    <!-- Column 1: Awadh Peasant Struggle -->
    <g transform="translate(40, 70)" filter="url(#shadow7)">
        <rect width="340" height="355" rx="8" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
        <rect x="15" y="15" width="170" height="24" rx="12" fill="#2e7d32"/>
        <text x="100" y="31" class="badge">1. AWADH PEASANTS (UP)</text>
        <rect x="15" y="48" width="310" height="2" fill="#c8e6c9"/>

        <text x="15" y="72" class="card-title">Led by Baba Ramchandra</text>

        <text x="15" y="96" class="card-text">• <tspan font-weight="700">Leader:</tspan> Baba Ramchandra (a sanyasi who had earlier</text>
        <text x="23" y="112" class="card-text">been an indentured laborer in Fiji)</text>

        <text x="15" y="136" class="card-text">• <tspan font-weight="700" fill="#c62828">Opponents:</tspan> Talukdars and landlords who demanded</text>
        <text x="23" y="152" class="card-text">exorbitantly high rents and a variety of other cesses</text>

        <text x="15" y="176" class="card-text">• <tspan font-weight="700" fill="#c62828">Begar System:</tspan> Peasants forced to work at landlords'</text>
        <text x="23" y="192" class="card-text">farms without any payment; had no security of tenure</text>

        <text x="15" y="216" class="card-text">• <tspan font-weight="700" fill="#1b5e20">Demands:</tspan> Reduction of revenue, abolition of begar,</text>
        <text x="23" y="232" class="card-text">and social boycott of oppressive landlords (Nai-Dhobi bandhs)</text>

        <text x="15" y="256" class="card-text">• <tspan font-weight="700">Oudh Kisan Sabha (Oct 1920):</tspan> Formed by Jawaharlal</text>
        <text x="23" y="272" class="card-text">Nehru, Baba Ramchandra &amp; others. 300+ branches in a month</text>

        <text x="15" y="296" class="card-text">• <tspan font-weight="700" fill="#c62828">Violent Turn (1921):</tspan> Houses of talukdars attacked,</text>
        <text x="23" y="312" class="card-text">bazaars looted, grain hoards taken over; Congress unhappy</text>
    </g>

    <!-- Column 2: Gudem Hills Tribal Struggle -->
    <g transform="translate(420, 70)" filter="url(#shadow7)">
        <rect width="340" height="355" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="190" height="24" rx="12" fill="#e65100"/>
        <text x="110" y="31" class="badge">2. GUDEM HILLS TRIBALS (AP)</text>
        <rect x="15" y="48" width="310" height="2" fill="#ffe0b2"/>

        <text x="15" y="72" class="card-title" fill="#e65100">Led by Alluri Sitaram Raju</text>

        <text x="15" y="96" class="card-text">• <tspan font-weight="700">Background:</tspan> Colonial government closed large forest</text>
        <text x="23" y="112" class="card-text">areas, preventing tribals from grazing cattle/collecting fuelwood</text>

        <text x="15" y="136" class="card-text">• Tribals felt their traditional rights were being denied;</text>
        <text x="23" y="152" class="card-text">forced to contribute <tspan font-weight="700" fill="#c62828">begar for road building</tspan></text>

        <text x="15" y="176" class="card-text">• <tspan font-weight="700" fill="#e65100">Alluri Sitaram Raju:</tspan> Claimed special astrological powers,</text>
        <text x="23" y="192" class="card-text">healing abilities &amp; bulletproof nature; revered as incarnation</text>

        <text x="15" y="216" class="card-text">• <tspan font-weight="700">Views on Gandhi:</tspan> Inspired by Non-Cooperation,</text>
        <text x="23" y="232" class="card-text">praised Gandhi, urged people to wear Khadi &amp; give up drinking</text>

        <text x="15" y="256" class="card-text">• <tspan font-weight="700" fill="#c62828">Belief in Violence:</tspan> Asserted India could be liberated</text>
        <text x="23" y="272" class="card-text">only by <tspan font-weight="700" fill="#c62828">force/use of violence</tspan>, not non-violence</text>

        <text x="15" y="296" class="card-text">• Gudem rebels attacked police stations; Raju executed in <tspan font-weight="700">1924</tspan></text>
    </g>
</svg>
