<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #6a1b9a; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #8e24aa; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #4a148c; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow5" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">KHILAFAT ISSUE &amp; NON-COOPERATION MOVEMENT (1919 – 1920)</text>
    <text x="400" y="52" class="subtitle">Forging Hindu-Muslim Unity for a Nationwide Mass Struggle</text>

    <!-- 3 Core Column Cards -->
    <!-- Card 1: Khilafat Issue -->
    <g transform="translate(40, 70)" filter="url(#shadow5)">
        <rect width="220" height="355" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#7b1fa2"/>
        <text x="82.5" y="31" class="badge">1. KHILAFAT ISSUE</text>
        <rect x="15" y="48" width="190" height="2" fill="#e1bee7"/>

        <text x="15" y="72" class="card-title">Defending the Khalifa</text>
        <text x="15" y="96" class="card-text">• WW1 ended with defeat of</text>
        <text x="23" y="112" class="card-text">Ottoman Turkey</text>

        <text x="15" y="134" class="card-text">• Harsh peace treaty rumored to</text>
        <text x="23" y="150" class="card-text">be imposed on Ottoman Emperor</text>
        <text x="23" y="166" class="card-text">(the <tspan font-weight="700">Khalifa</tspan> – spiritual head of</text>
        <text x="23" y="182" class="card-text">the Islamic world)</text>

        <text x="15" y="206" class="card-text">• <tspan font-weight="700" fill="#6a1b9a">Khilafat Committee:</tspan> Formed</text>
        <text x="23" y="222" class="card-text">in Bombay (March 1919) by young</text>
        <text x="23" y="238" class="card-text">Muslim leaders: <tspan font-weight="700">Muhammad Ali</tspan></text>
        <text x="23" y="254" class="card-text">&amp; <tspan font-weight="700">Shaukat Ali</tspan> (Ali Brothers)</text>

        <text x="15" y="280" class="card-text">• Approached Gandhi to launch a</text>
        <text x="23" y="296" class="card-text">united mass action against British</text>
    </g>

    <!-- Card 2: Why Non-Cooperation? -->
    <g transform="translate(290, 70)" filter="url(#shadow5)">
        <rect width="220" height="355" rx="8" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#303f9f"/>
        <text x="87.5" y="31" class="badge">2. HIND SWARAJ (1909)</text>
        <rect x="15" y="48" width="190" height="2" fill="#c5cae9"/>

        <text x="15" y="72" class="card-title" fill="#1a237e">Gandhi's Philosophy</text>
        <text x="15" y="96" class="card-text">• In his famous book <tspan font-weight="700" font-style="italic">Hind Swaraj</tspan>,</text>
        <text x="23" y="112" class="card-text">Mahatma Gandhi declared that:</text>

        <text x="15" y="136" class="card-text">• <tspan font-weight="700" fill="#303f9f">British rule was established</tspan></text>
        <text x="23" y="152" class="card-text">in India with the cooperation of</text>
        <text x="23" y="168" class="card-text">Indians, and survived only</text>
        <text x="23" y="184" class="card-text">because of this cooperation</text>

        <text x="15" y="208" class="card-text">• <tspan font-weight="700" fill="#c62828">If Indians refuse to cooperate,</tspan></text>
        <text x="23" y="224" class="card-text">British rule in India will collapse</text>
        <text x="23" y="240" class="card-text">within a year, and <tspan font-weight="700" fill="#1b5e20">Swaraj</tspan></text>
        <text x="23" y="256" class="card-text">would be achieved!</text>

        <text x="15" y="282" class="card-text">• <tspan font-weight="700">Hindu-Muslim Unity:</tspan> Gandhi</text>
        <text x="23" y="298" class="card-text">saw Khilafat as umbrella for unity</text>
    </g>

    <!-- Card 3: The Program Stages -->
    <g transform="translate(540, 70)" filter="url(#shadow5)">
        <rect width="220" height="355" rx="8" fill="#fff8e1" stroke="#ffe082" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#e65100"/>
        <text x="82.5" y="31" class="badge">3. MOVEMENT PLAN</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffecb3"/>

        <text x="15" y="72" class="card-title" fill="#e65100">Unfolding in Stages</text>

        <text x="15" y="96" class="card-text">• <tspan font-weight="700" fill="#e65100">Stage 1: Surrender Titles</tspan></text>
        <text x="23" y="112" class="card-text">Surrender titles awarded by govt</text>

        <text x="15" y="136" class="card-text">• <tspan font-weight="700" fill="#e65100">Stage 2: Triple Boycott</tspan></text>
        <text x="23" y="152" class="card-text">Boycott of civil services, army,</text>
        <text x="23" y="168" class="card-text">police, courts, legislative councils,</text>
        <text x="23" y="184" class="card-text">schools, and foreign goods</text>

        <text x="15" y="208" class="card-text">• <tspan font-weight="700" fill="#e65100">Stage 3: Full Civil Disobedience</tspan></text>
        <text x="23" y="224" class="card-text">If government uses repression</text>

        <text x="15" y="250" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Calcutta Congress (Sept 1920):</tspan></text>
        <text x="23" y="266" class="card-text">Gandhi convinced leaders</text>

        <text x="15" y="292" class="card-text">• <tspan font-weight="700" fill="#2e7d32">Nagpur Congress (Dec 1920):</tspan></text>
        <text x="23" y="308" class="card-text">Compromise reached &amp; NCM adopted</text>
    </g>
</svg>
