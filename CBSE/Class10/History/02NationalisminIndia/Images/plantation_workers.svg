<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #e65100; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #f57c00; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ef6c00; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow8" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">SWARAJ IN THE PLANTATIONS (ASSAM TEA WORKERS)</text>
    <text x="400" y="52" class="subtitle">Understanding Freedom: Defying the Inland Emigration Act of 1859</text>

    <!-- 3 Step Cards -->
    <!-- Card 1: Meaning of Swaraj -->
    <g transform="translate(40, 70)" filter="url(#shadow8)">
        <rect width="220" height="355" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#e65100"/>
        <text x="87.5" y="31" class="badge">1. MEANING OF SWARAJ</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>

        <text x="15" y="72" class="card-title">Right to Move Freely</text>

        <text x="15" y="96" class="card-text">• For plantation workers in Assam,</text>
        <text x="23" y="112" class="card-text">freedom meant the <tspan font-weight="700">right to move</tspan></text>
        <text x="23" y="128" class="card-text"><tspan font-weight="700">freely</tspan> in and out of the</text>
        <text x="23" y="144" class="card-text">confined tea garden space</text>

        <text x="15" y="168" class="card-text">• It meant retaining a connection</text>
        <text x="23" y="184" class="card-text">with the village from which they</text>
        <text x="23" y="200" class="card-text">had originally come</text>

        <text x="15" y="224" class="card-text">• Under colonial rules, workers</text>
        <text x="23" y="240" class="card-text">were confined like prisoners in</text>
        <text x="23" y="256" class="card-text">the tea estates</text>

        <text x="15" y="280" class="card-text">• They interpreted Gandhi Raj as</text>
        <text x="23" y="296" class="card-text">a era where everyone would be</text>
        <text x="23" y="312" class="card-text">given land in their own villages</text>
    </g>

    <!-- Card 2: Inland Emigration Act -->
    <g transform="translate(290, 70)" filter="url(#shadow8)">
        <rect width="220" height="355" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
        <rect x="15" y="15" width="155" height="24" rx="12" fill="#c62828"/>
        <text x="92.5" y="31" class="badge">2. EMIGRATION ACT (1859)</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffcdd2"/>

        <text x="15" y="72" class="card-title" fill="#b71c1c">Repressive Law</text>

        <text x="15" y="96" class="card-text">• Under the <tspan font-weight="700" fill="#c62828">Inland Emigration</tspan></text>
        <text x="23" y="112" class="card-text"><tspan font-weight="700" fill="#c62828">Act of 1859</tspan>, tea plantation</text>
        <text x="23" y="128" class="card-text">workers were not permitted to leave</text>
        <text x="23" y="144" class="card-text">the tea gardens without permission</text>

        <text x="15" y="168" class="card-text">• In practice, such permission</text>
        <text x="23" y="184" class="card-text">was <tspan font-weight="700">rarely given</tspan> by British</text>
        <text x="23" y="200" class="card-text">plantation managers</text>

        <text x="15" y="224" class="card-text">• Hearing of Non-Cooperation,</text>
        <text x="23" y="240" class="card-text">thousands of workers <tspan font-weight="700" fill="#c62828">defied</tspan></text>
        <text x="23" y="256" class="card-text"><tspan font-weight="700" fill="#c62828">the authorities</tspan>, left the</text>
        <text x="23" y="272" class="card-text">plantations, and headed home</text>

        <text x="15" y="296" class="card-text">• Believed "Gandhi Raj" was coming</text>
    </g>

    <!-- Card 3: Tragic End -->
    <g transform="translate(540, 70)" filter="url(#shadow8)">
        <rect width="220" height="355" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#7b1fa2"/>
        <text x="82.5" y="31" class="badge">3. TRAGIC OUTCOME</text>
        <rect x="15" y="48" width="190" height="2" fill="#e1bee7"/>

        <text x="15" y="72" class="card-title" fill="#4a148c">Stranded &amp; Beaten</text>

        <text x="15" y="96" class="card-text">• Workers never reached home</text>

        <text x="15" y="120" class="card-text">• Stranded on the way due to a</text>
        <text x="23" y="136" class="card-text"><tspan font-weight="700">railway and steamer strike</tspan></text>

        <text x="15" y="160" class="card-text">• British police caught up with</text>
        <text x="23" y="176" class="card-text">them on the roads &amp; stations</text>

        <text x="15" y="200" class="card-text">• Workers were <tspan font-weight="700" fill="#c62828">brutally beaten up</tspan></text>
        <text x="23" y="216" class="card-text">by police and forced back</text>

        <text x="15" y="240" class="card-text">• <tspan font-weight="700">Key Conclusion:</tspan> These local</text>
        <text x="23" y="256" class="card-text">visions of Swaraj were not defined</text>
        <text x="23" y="272" class="card-text">by Congress, but expressed total</text>
        <text x="23" y="288" class="card-text">freedom from all suffering</text>
    </g>
</svg>
