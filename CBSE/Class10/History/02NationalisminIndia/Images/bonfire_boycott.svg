<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <defs>
        <style>
            .bg { fill: #ffffff; }
            .heading { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #1565c0; text-anchor: middle; }
            .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #1976d2; text-anchor: middle; font-style: italic; }
            .card-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0d47a1; }
            .card-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #37474f; }
            .badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        </style>
        <filter id="shadow6" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
        </filter>
    </defs>

    <rect class="bg" width="800" height="450" rx="10"/>

    <text x="400" y="34" class="heading">NON-COOPERATION IN TOWNS (1921 – 1922)</text>
    <text x="400" y="52" class="subtitle">Middle-Class Participation &amp; Economic Boycott</text>

    <!-- 3 Grid Cards -->
    <!-- Card 1: Social Boycott -->
    <g transform="translate(40, 70)" filter="url(#shadow6)">
        <rect width="220" height="355" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
        <rect x="15" y="15" width="125" height="24" rx="12" fill="#1976d2"/>
        <text x="77.5" y="31" class="badge">SOCIAL BOYCOTT</text>
        <rect x="15" y="48" width="190" height="2" fill="#bbdefb"/>

        <text x="15" y="72" class="card-title">Middle-Class Action</text>

        <text x="15" y="96" class="card-text">• Thousands of students left</text>
        <text x="23" y="112" class="card-text">government-controlled schools</text>
        <text x="23" y="128" class="card-text">and colleges</text>

        <text x="15" y="152" class="card-text">• Headmasters and teachers</text>
        <text x="23" y="168" class="card-text">resigned from services</text>

        <text x="15" y="192" class="card-text">• Lawyers gave up their legal</text>
        <text x="23" y="208" class="card-text">practice in courts (Motilal Nehru,</text>
        <text x="23" y="224" class="card-text">C.R. Das, Asaf Ali)</text>

        <text x="15" y="248" class="card-text">• Council elections boycotted in</text>
        <text x="23" y="264" class="card-text">most provinces (except Madras by</text>
        <text x="23" y="280" class="card-text">the <tspan font-weight="700">Justice Party</tspan> of non-Brahmans)</text>
    </g>

    <!-- Card 2: Economic Impact -->
    <g transform="translate(290, 70)" filter="url(#shadow6)">
        <rect width="220" height="355" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
        <rect x="15" y="15" width="135" height="24" rx="12" fill="#e65100"/>
        <text x="82.5" y="31" class="badge">ECONOMIC IMPACT</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffe0b2"/>

        <text x="15" y="72" class="card-title" fill="#e65100">Foreign Cloth &amp; Goods</text>

        <text x="15" y="96" class="card-text">• Foreign cloth boycotted and</text>
        <text x="23" y="112" class="card-text">burnt in huge <tspan font-weight="700" fill="#d32f2f">bonfires</tspan> in streets</text>

        <text x="15" y="136" class="card-text">• Liquor shops picketed across towns</text>

        <text x="15" y="160" class="card-text">• <tspan font-weight="700" fill="#e65100">Cloth Imports Halved:</tspan> Import</text>
        <text x="23" y="176" class="card-text">dropped from <tspan font-weight="700">₹102 crore</tspan> to</text>
        <text x="23" y="192" class="card-text"><tspan font-weight="700" fill="#d32f2f">₹57 crore</tspan> between 1921 &amp; 1922</text>

        <text x="15" y="216" class="card-text">• Merchants &amp; traders refused to</text>
        <text x="23" y="232" class="card-text">trade in foreign goods or finance</text>
        <text x="23" y="248" class="card-text">foreign trade</text>

        <text x="15" y="272" class="card-text">• Production of Indian textile mills</text>
        <text x="23" y="288" class="card-text">&amp; handlooms went up significantly</text>
    </g>

    <!-- Card 3: Why Movement Slowed Down -->
    <g transform="translate(540, 70)" filter="url(#shadow6)">
        <rect width="220" height="355" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
        <rect x="15" y="15" width="145" height="24" rx="12" fill="#c62828"/>
        <text x="87.5" y="31" class="badge">WHY IT SLOWED DOWN</text>
        <rect x="15" y="48" width="190" height="2" fill="#ffcdd2"/>

        <text x="15" y="72" class="card-title" fill="#b71c1c">Limitations in Cities</text>

        <text x="15" y="96" class="card-text">• <tspan font-weight="700" fill="#c62828">Khadi Cloth Was Expensive:</tspan></text>
        <text x="23" y="112" class="card-text">Mass-produced mill cloth was cheap;</text>
        <text x="23" y="128" class="card-text">poor people could not afford Khadi</text>
        <text x="23" y="144" class="card-text">for a long period</text>

        <text x="15" y="168" class="card-text">• <tspan font-weight="700" fill="#c62828">Lack of Indian Institutions:</tspan></text>
        <text x="23" y="184" class="card-text">Alternative national institutions</text>
        <text x="23" y="200" class="card-text">were slow to be set up to replace</text>
        <text x="23" y="216" class="card-text">British ones</text>

        <text x="15" y="240" class="card-text">• Students &amp; teachers slowly trickled</text>
        <text x="23" y="256" class="card-text">back to government schools</text>

        <text x="15" y="280" class="card-text">• Lawyers re-joined government courts</text>
    </g>
</svg>
