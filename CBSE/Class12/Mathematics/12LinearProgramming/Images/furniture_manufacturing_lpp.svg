<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
    
    <text x="300" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Practice Problem 3 — Furniture Manufacturing LPP</text>
    
    <!-- Feasible Region -->
    <polygon points="60,400 460,400 60,160" fill="rgba(0, 150, 136, 0.2)" />
    <text x="140" y="350" font-size="14" font-weight="bold" fill="#00695c">Feasible Region</text>
    
    <!-- Grid -->
    <line x1="160" y1="40" x2="160" y2="400" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="260" y1="40" x2="260" y2="400" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="360" y1="40" x2="360" y2="400" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="460" y1="40" x2="460" y2="400" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="560" y1="40" x2="560" y2="400" stroke="#e0e0e0" stroke-width="1"/>
    
    <line x1="60" y1="320" x2="560" y2="320" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="60" y1="240" x2="560" y2="240" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="60" y1="160" x2="560" y2="160" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="60" y1="80" x2="560" y2="80" stroke="#e0e0e0" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="60" y1="400" x2="580" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="310" y="440" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Number of Tables (x)</text>
    
    <line x1="60" y1="400" x2="60" y2="20" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="20" y="210" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" transform="rotate(-90, 20, 210)">Number of Chairs (y)</text>
    
    <!-- Labels -->
    <text x="60" y="418" font-size="12" fill="#666" text-anchor="middle">0</text>
    <text x="160" y="418" font-size="12" fill="#666" text-anchor="middle">5</text>
    <text x="260" y="418" font-size="12" fill="#666" text-anchor="middle">10</text>
    <text x="360" y="418" font-size="12" fill="#666" text-anchor="middle">15</text>
    <text x="460" y="418" font-size="12" fill="#666" text-anchor="middle">20</text>
    <text x="560" y="418" font-size="12" fill="#666" text-anchor="middle">25</text>
    
    <text x="45" y="324" font-size="12" fill="#666" text-anchor="end">10</text>
    <text x="45" y="244" font-size="12" fill="#666" text-anchor="end">20</text>
    <text x="45" y="164" font-size="12" fill="#666" text-anchor="end">30</text>
    <text x="45" y="84" font-size="12" fill="#666" text-anchor="end">40</text>
    
    <!-- Lines -->
    <line x1="480" y1="432" x2="40" y2="48" stroke="#1e88e5" stroke-width="3"/>
    <rect x="220" y="240" width="110" height="20" fill="white" fill-opacity="0.8"/>
    <text x="225" y="255" font-size="14" font-weight="bold" fill="#1e88e5">L1: 2x + y = 40</text>
    
    <line x1="480" y1="412" x2="40" y2="148" stroke="#43a047" stroke-width="3"/>
    <rect x="220" y="280" width="120" height="20" fill="white" fill-opacity="0.8"/>
    <text x="225" y="295" font-size="14" font-weight="bold" fill="#43a047">L2: 3x + 2y = 60</text>
    
    <!-- Points -->
    <circle cx="60" cy="400" r="6" fill="#d32f2f"/>
    <text x="70" y="390" font-size="14" font-weight="bold" fill="#d32f2f">O(0,0)</text>
    
    <circle cx="60" cy="160" r="6" fill="#d32f2f"/>
    <text x="70" y="150" font-size="14" font-weight="bold" fill="#d32f2f">C(0,30)</text>
    <text x="70" y="170" font-size="12" font-weight="bold" fill="#444">Z=9000</text>
    
    <circle cx="460" cy="400" r="6" fill="#d32f2f"/>
    <text x="470" y="390" font-size="14" font-weight="bold" fill="#d32f2f">A(20,0)</text>
    <text x="470" y="410" font-size="14" font-weight="bold" fill="#2e7d32">Z=10000 ← MAX</text>
    
    <!-- Table -->
    <g transform="translate(380, 50)">
        <rect x="0" y="0" width="190" height="90" fill="white" stroke="#ccc" stroke-width="1"/>
        <rect x="0" y="0" width="190" height="25" fill="#1e88e5"/>
        <text x="95" y="17" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Corner | Z = 500x + 300y</text>
        
        <text x="10" y="42" font-size="12" fill="#333">O(0,0)</text>
        <text x="100" y="42" font-size="12" fill="#333">0</text>
        
        <rect x="0" y="48" width="190" height="20" fill="#e8f5e9"/>
        <text x="10" y="62" font-size="12" font-weight="bold" fill="#2e7d32">A(20,0)</text>
        <text x="100" y="62" font-size="12" font-weight="bold" fill="#2e7d32">10000 (Max)</text>
        
        <text x="10" y="82" font-size="12" fill="#333">C(0,30)</text>
        <text x="100" y="82" font-size="12" fill="#333">9000</text>
    </g>
</svg>
