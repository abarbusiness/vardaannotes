<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
        </marker>
    </defs>
    
    <text x="300" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Practice Problem 4 — NCERT Toy Manufacturing LPP</text>
    
    <!-- Feasible Region -->
    <polygon points="60,400 435,400 385,356.25 60,242.5" fill="rgba(0, 150, 136, 0.2)" />
    <text x="180" y="340" font-size="14" font-weight="bold" fill="#00695c">Feasible Region</text>
    
    <!-- Grid -->
    <g stroke="#e0e0e0" stroke-width="1">
        <line x1="122.5" y1="40" x2="122.5" y2="400"/>
        <line x1="185" y1="40" x2="185" y2="400"/>
        <line x1="247.5" y1="40" x2="247.5" y2="400"/>
        <line x1="310" y1="40" x2="310" y2="400"/>
        <line x1="372.5" y1="40" x2="372.5" y2="400"/>
        <line x1="435" y1="40" x2="435" y2="400"/>
        <line x1="497.5" y1="40" x2="497.5" y2="400"/>
        <line x1="560" y1="40" x2="560" y2="400"/>
        
        <line x1="60" y1="356.25" x2="560" y2="356.25"/>
        <line x1="60" y1="312.5" x2="560" y2="312.5"/>
        <line x1="60" y1="268.75" x2="560" y2="268.75"/>
        <line x1="60" y1="225" x2="560" y2="225"/>
        <line x1="60" y1="181.25" x2="560" y2="181.25"/>
        <line x1="60" y1="137.5" x2="560" y2="137.5"/>
        <line x1="60" y1="93.75" x2="560" y2="93.75"/>
        <line x1="60" y1="50" x2="560" y2="50"/>
    </g>
    
    <!-- Axes -->
    <line x1="60" y1="400" x2="580" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="310" y="440" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Number of Toy A (x)</text>
    
    <line x1="60" y1="400" x2="60" y2="20" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="20" y="210" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" transform="rotate(-90, 20, 210)">Number of Toy B (y)</text>
    
    <!-- Labels -->
    <g font-size="12" fill="#666" text-anchor="middle">
        <text x="60" y="418">0</text>
        <text x="122.5" y="418">10</text>
        <text x="185" y="418">20</text>
        <text x="247.5" y="418">30</text>
        <text x="310" y="418">40</text>
        <text x="372.5" y="418">50</text>
        <text x="435" y="418">60</text>
        <text x="497.5" y="418">70</text>
        <text x="560" y="418">80</text>
    </g>
    <g font-size="12" fill="#666" text-anchor="end">
        <text x="45" y="360.25">10</text>
        <text x="45" y="316.5">20</text>
        <text x="45" y="272.75">30</text>
        <text x="45" y="229">40</text>
        <text x="45" y="185.25">50</text>
        <text x="45" y="141.5">60</text>
        <text x="45" y="97.75">70</text>
        <text x="45" y="54">80</text>
    </g>
    
    <!-- Lines -->
    <line x1="460" y1="421.875" x2="40" y2="54.375" stroke="#1e88e5" stroke-width="3"/>
    <rect x="250" y="180" width="160" height="20" fill="white" fill-opacity="0.8"/>
    <text x="255" y="195" font-size="14" font-weight="bold" fill="#1e88e5">L1: 5x + 4y = 300</text>
    
    <line x1="535" y1="410.9" x2="40" y2="233.75" stroke="#43a047" stroke-width="3"/>
    <rect x="250" y="260" width="130" height="20" fill="white" fill-opacity="0.8"/>
    <text x="255" y="275" font-size="14" font-weight="bold" fill="#43a047">L2: x + 2y = 72</text>
    
    <!-- Points -->
    <circle cx="60" cy="400" r="6" fill="#d32f2f"/>
    <text x="70" y="390" font-size="14" font-weight="bold" fill="#d32f2f">O(0,0)</text>
    
    <circle cx="60" cy="242.5" r="6" fill="#d32f2f"/>
    <text x="70" y="235" font-size="14" font-weight="bold" fill="#d32f2f">C(0,36)</text>
    <text x="70" y="255" font-size="12" font-weight="bold" fill="#444">Z=180</text>
    
    <circle cx="435" cy="400" r="6" fill="#d32f2f"/>
    <text x="445" y="390" font-size="14" font-weight="bold" fill="#d32f2f">A(60,0)</text>
    <text x="445" y="410" font-size="12" font-weight="bold" fill="#444">Z=360</text>
    
    <circle cx="385" cy="356.25" r="8" fill="#ffb300"/>
    <text x="395" y="345" font-size="14" font-weight="bold" fill="#d32f2f">B(52,10)</text>
    <text x="395" y="365" font-size="14" font-weight="bold" fill="#2e7d32">Z=362 ← MAX</text>
    
    <!-- Table -->
    <g transform="translate(390, 50)">
        <rect x="0" y="0" width="170" height="110" fill="white" stroke="#ccc" stroke-width="1"/>
        <rect x="0" y="0" width="170" height="25" fill="#1e88e5"/>
        <text x="85" y="17" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Corner | Z = 6x + 5y</text>
        
        <text x="10" y="42" font-size="12" fill="#333">O(0,0)</text>
        <text x="100" y="42" font-size="12" fill="#333">0</text>
        
        <text x="10" y="62" font-size="12" fill="#333">A(60,0)</text>
        <text x="100" y="62" font-size="12" fill="#333">360</text>
        
        <rect x="0" y="68" width="170" height="20" fill="#e8f5e9"/>
        <text x="10" y="82" font-size="12" font-weight="bold" fill="#2e7d32">B(52,10)</text>
        <text x="100" y="82" font-size="12" font-weight="bold" fill="#2e7d32">362 (Max)</text>
        
        <text x="10" y="102" font-size="12" fill="#333">C(0,36)</text>
        <text x="100" y="102" font-size="12" fill="#333">180</text>
    </g>
</svg>
