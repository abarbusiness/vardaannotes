<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Sheet - Structure of Atom | Vardaan Comet</title>
    <link rel="icon" type="image/png" href="../../../../favicon.png">
    <link rel="apple-touch-icon" href="../../../../favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #05020a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- BACKGROUND PARTICLES EFFECT --- */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(170, 51, 255, 0.15) 0%, rgba(5, 2, 10, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* --- MAIN CONTAINER --- */
        #main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- NAV BAR --- */
        .nav-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            text-decoration: none;
            color: #00ffff;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transform: translateX(-5px);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        /* --- HEADER --- */
        .header-section {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 0 20px rgba(170, 51, 255, 0.8);
            letter-spacing: 1px;
        }

        .subtitle {
            color: #dcbfff;
            margin-top: 6px;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .instruction-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(170, 51, 255, 0.15);
            border: 1px solid rgba(170, 51, 255, 0.4);
            color: #e0b0ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* --- DARK MODE / IMAGE INVERT BUTTON --- */
        .invert-toggle-btn {
            background: rgba(170, 51, 255, 0.2);
            border: 1px solid rgba(170, 51, 255, 0.5);
            color: #00ffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .invert-toggle-btn:hover {
            background: rgba(170, 51, 255, 0.4);
            box-shadow: 0 0 15px rgba(170, 51, 255, 0.6);
            transform: translateY(-2px);
        }

        .invert-toggle-btn.active {
            background: rgba(0, 255, 255, 0.25);
            border-color: #00ffff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* --- SLIDER / CAROUSEL CONTAINER --- */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 10px 0 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .carousel-viewport {
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(170, 51, 255, 0.3);
            background: rgba(15, 8, 25, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(170, 51, 255, 0.2);
            touch-action: pan-y;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .formula-img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            user-select: none;
            -webkit-user-drag: none;
            transition: filter 0.3s ease, transform 0.3s ease;
            cursor: zoom-in;
        }

        /* INVERTED IMAGE STYLING (DARK MODE) */
        .formula-img.inverted, .modal-img.inverted {
            filter: invert(1) hue-rotate(180deg);
            mix-blend-mode: screen;
        }

        /* --- ARROW BUTTONS --- */
        .slider-arrow {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(10, 5, 20, 0.85);
            border: 1px solid rgba(170, 51, 255, 0.5);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .slider-arrow:hover {
            background: #aa33ff;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(170, 51, 255, 0.8), 0 0 10px rgba(0, 255, 255, 0.5);
            transform: translateY(-50%) scale(1.1);
        }

        .slider-arrow.prev { left: -20px; }
        .slider-arrow.next { right: -20px; }

        /* --- DOTS / INDICATORS --- */
        .carousel-indicators {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            align-items: center;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(170, 51, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator-dot.active {
            background: #aa33ff;
            width: 32px;
            border-radius: 10px;
            box-shadow: 0 0 12px #aa33ff;
            border-color: #00ffff;
        }

        .page-badge {
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: 600;
            margin-top: 8px;
        }

        /* --- FULLSCREEN MODAL FOR ZOOMING --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
        }

        .modal-img {
            max-width: 95%;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(170, 51, 255, 0.5);
            transition: filter 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 2rem;
            cursor: pointer;
            z-index: 10001;
            background: rgba(170, 51, 255, 0.4);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #d81b60;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .slider-arrow.prev { left: 5px; }
            .slider-arrow.next { right: 5px; }
            h1 { font-size: 1.5rem; }
            .carousel-slide { padding: 8px; }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <div id="main-container">
        <!-- NAV -->
        <div class="nav-bar">
            <a href="../../Chemistry.html" class="back-btn">
                <i data-lucide="arrow-left"></i> Chemistry Chapters
            </a>
            <a href="../../../../index.html" class="brand-container">
                <img src="../../../../Vardaan comet logo animation video loop.gif" alt="Vardaan Comet Logo" class="logo-img" onerror="this.onerror=null; this.src='https://res.cloudinary.com/dxwszplz7/image/upload/v1783346988/Vardaan_Comet_bg_removed_hpjuhv.png';">
            </a>
        </div>

        <!-- HEADER -->
        <div class="header-section">
            <h1>STRUCTURE OF ATOM</h1>
            <div class="subtitle">Class 11 Chemistry • Formula Sheet & Quick Cards</div>
            
            <div class="header-controls">
                <div class="instruction-badge">
                    <i data-lucide="move-horizontal"></i> Slide left/right • Click to zoom
                </div>
                <button class="invert-toggle-btn" id="invertToggleBtn" onclick="toggleInvert()" aria-label="Toggle Image Invert / Dark Mode">
                    <i data-lucide="moon" id="invertIcon"></i>
                    <span id="invertText">Dark Mode (Invert Image)</span>
                </button>
            </div>
        </div>

        <!-- CAROUSEL SLIDER -->
        <div class="carousel-wrapper">
            <button class="slider-arrow prev" onclick="moveSlide(-1)" aria-label="Previous Page">
                <i data-lucide="chevron-left"></i>
            </button>
            <button class="slider-arrow next" onclick="moveSlide(1)" aria-label="Next Page">
                <i data-lucide="chevron-right"></i>
            </button>

            <div class="carousel-viewport" id="carouselViewport">
                <div class="carousel-track" id="carouselTrack">
                    <!-- SLIDE 1 -->
                    <div class="carousel-slide">
                        <img src="Formula%20Sheet/formula%20sheet%20page%201.png" alt="Formula Sheet Page 1" class="formula-img" id="img1" onclick="openModal(this.src)">
                    </div>
                    <!-- SLIDE 2 -->
                    <div class="carousel-slide">
                        <img src="Formula%20Sheet/formula%20sheet%20page%202.png" alt="Formula Sheet Page 2" class="formula-img" id="img2" onclick="openModal(this.src)">
                    </div>
                </div>
            </div>

            <!-- INDICATORS -->
            <div class="carousel-indicators">
                <div class="indicator-dot active" onclick="goToSlide(0)"></div>
                <div class="indicator-dot" onclick="goToSlide(1)"></div>
            </div>
            <div class="page-badge" id="pageBadge">Page 1 of 2</div>
        </div>
    </div>

    <!-- FULLSCREEN ZOOM MODAL -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <div class="modal-close" onclick="closeModal()">&times;</div>
        <img class="modal-img" id="modalImg">
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let currentIndex = 0;
        const totalSlides = 2;
        const track = document.getElementById('carouselTrack');
        const dots = document.querySelectorAll('.indicator-dot');
        const pageBadge = document.getElementById('pageBadge');
        let isInverted = false;

        function updateCarousel() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            pageBadge.textContent = `Page ${currentIndex + 1} of ${totalSlides}`;
        }

        function moveSlide(direction) {
            currentIndex = (currentIndex + direction + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateCarousel();
        }

        // TOGGLE IMAGE INVERSION (DARK MODE)
        function toggleInvert() {
            isInverted = !isInverted;
            const formulaImgs = document.querySelectorAll('.formula-img');
            const modalImg = document.getElementById('modalImg');
            const btn = document.getElementById('invertToggleBtn');
            const text = document.getElementById('invertText');

            if (isInverted) {
                formulaImgs.forEach(img => img.classList.add('inverted'));
                modalImg.classList.add('inverted');
                btn.classList.add('active');
                text.textContent = 'Light Mode (Original Image)';
            } else {
                formulaImgs.forEach(img => img.classList.remove('inverted'));
                modalImg.classList.remove('inverted');
                btn.classList.remove('active');
                text.textContent = 'Dark Mode (Invert Image)';
            }
        }

        // TOUCH SWIPE SUPPORT FOR MOBILE
        const viewport = document.getElementById('carouselViewport');
        let startX = 0;
        let dist = 0;

        viewport.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            dist = 0;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!startX) return;
            let currentX = e.touches[0].clientX;
            dist = currentX - startX;
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
            if (dist < -50) {
                moveSlide(1); // Swipe Left -> Next
            } else if (dist > 50) {
                moveSlide(-1); // Swipe Right -> Prev
            }
            startX = 0;
            dist = 0;
        });

        // KEYBOARD ARROW NAVIGATION
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') moveSlide(1);
            if (e.key === 'ArrowLeft') moveSlide(-1);
            if (e.key === 'Escape') closeModal();
        });

        // ZOOM MODAL FUNCTIONS
        function openModal(imgSrc) {
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            if (isInverted) {
                modalImg.classList.add('inverted');
            } else {
                modalImg.classList.remove('inverted');
            }
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>

</html>
