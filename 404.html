<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in the Cosmic Void | Vardaan Comet</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: 1;
        }
        .content-card {
            position: relative;
            z-index: 10;
            max-width: 600px;
            background: rgba(10, 5, 20, 0.75);
            border: 1px solid rgba(170, 51, 255, 0.3);
            border-radius: 20px;
            padding: 48px 32px;
            box-shadow: 0 0 50px rgba(170, 51, 255, 0.2);
            backdrop-filter: blur(12px);
        }
        .logo-img {
            width: 110px;
            height: 110px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }
        .error-code {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #aa33ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }
        .error-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 16px;
        }
        .error-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #aa33ff, #7928ca);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(170, 51, 255, 0.4);
        }
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            background: linear-gradient(135deg, #00ffff, #aa33ff);
            color: #000;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="stars-bg"></div>
    <div class="content-card">
        <img src="vardaan comet logo favicon image.png" alt="Vardaan Comet Logo" class="logo-img">
        <div class="error-code">404</div>
        <h1 class="error-title">LOST IN THE COSMIC VOID</h1>
        <p class="error-desc">The module, chapter, or coordinate you are looking for has drifted out of this orbit. Let's navigate you back to the learning universe.</p>
        <a href="index.html" class="home-btn">
            <i class="fas fa-compass"></i> Back to Universe Dashboard
        </a>
        <div class="footer-note">POWERED BY VARDAAN COMET</div>
    </div>
</body>
</html>
